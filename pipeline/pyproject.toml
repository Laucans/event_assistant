[project]
name = "pipeline"
version = "0.1.0"
description = "The unattended pipeline runner: a sequence of Claude Code sessions."
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.150",
    # Le modele d'etat d'un round. Arrivait avec crewai ; declare ici depuis
    # que le moteur de graphe est parti.
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
