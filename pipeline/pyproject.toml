[project]
name = "pipeline"
version = "0.1.0"
description = "The unattended docs-pipeline runner: CrewAI Flow over Claude Code sessions."
requires-python = ">=3.13,<3.14"   # plafond impose par crewai
dependencies = [
    "crewai>=1.15",
    "claude-agent-sdk>=0.2.150",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
