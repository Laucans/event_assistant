name: ci

on:
  push:
    branches: [main, main_agent]
  pull_request:
    # main_agent is the integration branch scripts/agent-loop.sh merges into;
    # without it here those PRs get no check and `gh pr checks` never resolves.
    branches: [main, main_agent]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Cheap checks first, so the slow build is not what fails on a typo.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
